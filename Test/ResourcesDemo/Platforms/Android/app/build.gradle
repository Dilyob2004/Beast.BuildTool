apply plugin: 'com.android.application'
android {
    compileSdk 35
    namespace 'com.beast.resourcesdemo'
    defaultConfig {
        applicationId "com.beast.resourcesdemo"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilter "arm64-v8a"
        }
    }
    sourceSets {
        main {
			jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }
	
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
    }
    packaging {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }
}
